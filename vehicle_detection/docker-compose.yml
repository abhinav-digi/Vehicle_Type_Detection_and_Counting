services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vehicle_app
      POSTGRES_PASSWORD: vehicle_app
      POSTGRES_DB: vehicle_detection
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehicle_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vehicle_app:vehicle_app@db:5432/vehicle_detection
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads

volumes:
  db_data:
  uploads_data:
